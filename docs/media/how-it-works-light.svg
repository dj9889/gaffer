<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b9a93"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98500"/></marker></defs>
<rect width="1200" height="600" rx="18" fill="#fcfcfb"/>
<rect x="20" y="20" width="1160" height="130" rx="14" fill="#f3f2ee" stroke="#e1e0d9"/>
<text x="40" y="48" font-size="15" font-weight="650" fill="#52514e">Your team, in Slack</text>
<rect x="20" y="165" width="1160" height="265" rx="14" fill="#f3f2ee" stroke="#e1e0d9"/>
<text x="40" y="193" font-size="15" font-weight="650" fill="#52514e">gaffer: plain code you run</text>
<rect x="20" y="445" width="1160" height="135" rx="14" fill="#f3f2ee" stroke="#e1e0d9"/>
<text x="40" y="473" font-size="15" font-weight="650" fill="#52514e">Coding agents you already pay for</text>
<rect x="760" y="181" width="14" height="14" rx="4" fill="#ffffff" stroke="#e1e0d9"/><text x="780" y="193" font-size="13" fill="#898781">plain code</text>
<rect x="870" y="181" width="14" height="14" rx="4" fill="#2a78d6" stroke="#2a78d6"/><text x="890" y="193" font-size="13" fill="#898781">an agent</text>
<rect x="970" y="181" width="14" height="14" rx="4" fill="#fdf3dc" stroke="#c98500"/><text x="990" y="193" font-size="13" fill="#898781">a person decides</text>
<rect x="38.0" y="62" width="230" height="70" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="54.0" y="91" font-size="15" font-weight="600" fill="#0b0b0b">Ask in a channel</text>
<text x="54.0" y="115" font-size="13" fill="#898781">“signups fail for jo+test@…”</text>
<rect x="309.0" y="62" width="230" height="70" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="325.0" y="91" font-size="15" font-weight="600" fill="#0b0b0b">Approve the plan</text>
<text x="325.0" y="115" font-size="13" fill="#898781">or reject, with a note</text>
<rect x="549.0" y="62" width="230" height="70" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="565.0" y="91" font-size="15" font-weight="600" fill="#0b0b0b">Watch one live card</text>
<text x="565.0" y="115" font-size="13" fill="#898781">stage · spend · what it's doing</text>
<rect x="869.0" y="62" width="230" height="70" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="885.0" y="91" font-size="15" font-weight="600" fill="#0b0b0b">Approve the merge</text>
<text x="885.0" y="115" font-size="13" fill="#898781">then the PR and its receipt</text>
<rect x="40" y="215" width="96" height="52" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="88.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Triage</text>
<rect x="152" y="215" width="96" height="52" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="200.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Reserve $</text>
<line x1="138" y1="241.0" x2="149" y2="241.0" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="264" y="215" width="96" height="52" rx="10" fill="#2a78d6"/>
<text x="312.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#ffffff">Plan</text>
<line x1="250" y1="241.0" x2="261" y2="241.0" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="376" y="215" width="96" height="52" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/>
<text x="424.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#0b0b0b">Approval</text>
<line x1="424.0" y1="212" x2="424.0" y2="137" stroke="#c98500" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aw)"/>
<line x1="362" y1="241.0" x2="373" y2="241.0" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="488" y="215" width="96" height="52" rx="10" fill="#2a78d6"/>
<text x="536.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#ffffff">Build</text>
<line x1="474" y1="241.0" x2="485" y2="241.0" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="600" y="215" width="96" height="52" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="648.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Test</text>
<line x1="586" y1="241.0" x2="597" y2="241.0" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="712" y="215" width="96" height="52" rx="10" fill="#2a78d6"/>
<text x="760.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#ffffff">Review</text>
<line x1="698" y1="241.0" x2="709" y2="241.0" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="824" y="215" width="96" height="52" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="872.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">PR + CI</text>
<line x1="810" y1="241.0" x2="821" y2="241.0" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="936" y="215" width="96" height="52" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/>
<text x="984.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#0b0b0b">Approval</text>
<line x1="984.0" y1="212" x2="984.0" y2="137" stroke="#c98500" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aw)"/>
<line x1="922" y1="241.0" x2="933" y2="241.0" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="1048" y="215" width="96" height="52" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="1096.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Merge</text>
<line x1="1034" y1="241.0" x2="1045" y2="241.0" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M760.0,271 C760.0,297 536.0,297 536.0,273" fill="none" stroke="#9b9a93" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="648.0" y="309" text-anchor="middle" font-size="12.5" fill="#898781">test failures and review issues go back</text>
<rect x="40" y="342" width="268" height="72" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="56" y="370" font-size="14" font-weight="650" fill="#0b0b0b"><tspan fill="#0f7a0f">✓</tspan> Hard $ cap</text>
<text x="56" y="394" font-size="13" fill="#898781">metered live; killed at the cap</text>
<rect x="320" y="342" width="268" height="72" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="336" y="370" font-size="14" font-weight="650" fill="#0b0b0b"><tspan fill="#0f7a0f">✓</tspan> No secrets out</text>
<text x="336" y="394" font-size="13" fill="#898781">diffs scanned before every commit</text>
<rect x="600" y="342" width="268" height="72" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="616" y="370" font-size="14" font-weight="650" fill="#0b0b0b"><tspan fill="#0f7a0f">✓</tspan> Agents can't push</text>
<text x="616" y="394" font-size="13" fill="#898781">gaffer owns git, PRs and merges</text>
<rect x="880" y="342" width="268" height="72" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="896" y="370" font-size="14" font-weight="650" fill="#0b0b0b"><tspan fill="#0f7a0f">✓</tspan> Hash-chained audit</text>
<text x="896" y="394" font-size="13" fill="#898781">a receipt for every task</text>
<rect x="40" y="487" width="250" height="70" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<circle cx="62" cy="513" r="6" fill="#eb6834"/><text x="76" y="518" font-size="15" font-weight="650" fill="#0b0b0b">Claude Code</text>
<text x="56" y="542" font-size="13" fill="#898781">headless, in a git worktree</text>
<rect x="352" y="487" width="250" height="70" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<circle cx="374" cy="513" r="6" fill="#1baf7a"/><text x="388" y="518" font-size="15" font-weight="650" fill="#0b0b0b">Codex</text>
<text x="368" y="542" font-size="13" fill="#898781">headless, in a git worktree</text>
<line x1="294" y1="522" x2="348" y2="522" stroke="#9b9a93" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="321" y="512" text-anchor="middle" font-size="11.5" fill="#898781">out?</text>
<text x="640" y="512" font-size="14" fill="#52514e">Each step has a fallback chain: when one plan runs out,</text>
<text x="640" y="534" font-size="14" fill="#52514e">the next agent picks it up. Review goes to the other vendor.</text>
<text x="640" y="556" font-size="13" fill="#898781">Agents edit the worktree. They can’t push, merge, approve or overspend.</text>
</svg>