<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d6c66"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fab219"/></marker></defs>
<rect width="1200" height="600" rx="18" fill="#141413"/>
<rect x="20" y="20" width="1160" height="130" rx="14" fill="#1c1c1b" stroke="#2f2f2c"/>
<text x="40" y="48" font-size="15" font-weight="650" fill="#c3c2b7">Your team, in Slack</text>
<rect x="20" y="165" width="1160" height="265" rx="14" fill="#1c1c1b" stroke="#2f2f2c"/>
<text x="40" y="193" font-size="15" font-weight="650" fill="#c3c2b7">gaffer: plain code you run</text>
<rect x="20" y="445" width="1160" height="135" rx="14" fill="#1c1c1b" stroke="#2f2f2c"/>
<text x="40" y="473" font-size="15" font-weight="650" fill="#c3c2b7">Coding agents you already pay for</text>
<rect x="760" y="181" width="14" height="14" rx="4" fill="#232321" stroke="#2f2f2c"/><text x="780" y="193" font-size="13" fill="#8d8b84">plain code</text>
<rect x="870" y="181" width="14" height="14" rx="4" fill="#3987e5" stroke="#3987e5"/><text x="890" y="193" font-size="13" fill="#8d8b84">an agent</text>
<rect x="970" y="181" width="14" height="14" rx="4" fill="#3a2f12" stroke="#fab219"/><text x="990" y="193" font-size="13" fill="#8d8b84">a person decides</text>
<rect x="38.0" y="62" width="230" height="70" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="54.0" y="91" font-size="15" font-weight="600" fill="#f0efec">Ask in a channel</text>
<text x="54.0" y="115" font-size="13" fill="#8d8b84">“signups fail for jo+test@…”</text>
<rect x="309.0" y="62" width="230" height="70" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="325.0" y="91" font-size="15" font-weight="600" fill="#f0efec">Approve the plan</text>
<text x="325.0" y="115" font-size="13" fill="#8d8b84">or reject, with a note</text>
<rect x="549.0" y="62" width="230" height="70" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="565.0" y="91" font-size="15" font-weight="600" fill="#f0efec">Watch one live card</text>
<text x="565.0" y="115" font-size="13" fill="#8d8b84">stage · spend · what it's doing</text>
<rect x="869.0" y="62" width="230" height="70" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="885.0" y="91" font-size="15" font-weight="600" fill="#f0efec">Approve the merge</text>
<text x="885.0" y="115" font-size="13" fill="#8d8b84">then the PR and its receipt</text>
<rect x="40" y="215" width="96" height="52" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="88.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">Triage</text>
<rect x="152" y="215" width="96" height="52" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="200.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">Reserve $</text>
<line x1="138" y1="241.0" x2="149" y2="241.0" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="264" y="215" width="96" height="52" rx="10" fill="#3987e5"/>
<text x="312.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#ffffff">Plan</text>
<line x1="250" y1="241.0" x2="261" y2="241.0" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="376" y="215" width="96" height="52" rx="10" fill="#3a2f12" stroke="#fab219" stroke-width="1.5"/>
<text x="424.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#f0efec">Approval</text>
<line x1="424.0" y1="212" x2="424.0" y2="137" stroke="#fab219" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aw)"/>
<line x1="362" y1="241.0" x2="373" y2="241.0" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="488" y="215" width="96" height="52" rx="10" fill="#3987e5"/>
<text x="536.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#ffffff">Build</text>
<line x1="474" y1="241.0" x2="485" y2="241.0" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="600" y="215" width="96" height="52" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="648.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">Test</text>
<line x1="586" y1="241.0" x2="597" y2="241.0" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="712" y="215" width="96" height="52" rx="10" fill="#3987e5"/>
<text x="760.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#ffffff">Review</text>
<line x1="698" y1="241.0" x2="709" y2="241.0" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="824" y="215" width="96" height="52" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="872.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">PR + CI</text>
<line x1="810" y1="241.0" x2="821" y2="241.0" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="936" y="215" width="96" height="52" rx="10" fill="#3a2f12" stroke="#fab219" stroke-width="1.5"/>
<text x="984.0" y="247" text-anchor="middle" font-size="14" font-weight="650" fill="#f0efec">Approval</text>
<line x1="984.0" y1="212" x2="984.0" y2="137" stroke="#fab219" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aw)"/>
<line x1="922" y1="241.0" x2="933" y2="241.0" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="1048" y="215" width="96" height="52" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="1096.0" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">Merge</text>
<line x1="1034" y1="241.0" x2="1045" y2="241.0" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M760.0,271 C760.0,297 536.0,297 536.0,273" fill="none" stroke="#6d6c66" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="648.0" y="309" text-anchor="middle" font-size="12.5" fill="#8d8b84">test failures and review issues go back</text>
<rect x="40" y="342" width="268" height="72" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="56" y="370" font-size="14" font-weight="650" fill="#f0efec"><tspan fill="#33c233">✓</tspan> Hard $ cap</text>
<text x="56" y="394" font-size="13" fill="#8d8b84">metered live; killed at the cap</text>
<rect x="320" y="342" width="268" height="72" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="336" y="370" font-size="14" font-weight="650" fill="#f0efec"><tspan fill="#33c233">✓</tspan> No secrets out</text>
<text x="336" y="394" font-size="13" fill="#8d8b84">diffs scanned before every commit</text>
<rect x="600" y="342" width="268" height="72" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="616" y="370" font-size="14" font-weight="650" fill="#f0efec"><tspan fill="#33c233">✓</tspan> Agents can't push</text>
<text x="616" y="394" font-size="13" fill="#8d8b84">gaffer owns git, PRs and merges</text>
<rect x="880" y="342" width="268" height="72" rx="10" fill="#232321" stroke="#2f2f2c"/>
<text x="896" y="370" font-size="14" font-weight="650" fill="#f0efec"><tspan fill="#33c233">✓</tspan> Hash-chained audit</text>
<text x="896" y="394" font-size="13" fill="#8d8b84">a receipt for every task</text>
<rect x="40" y="487" width="250" height="70" rx="10" fill="#232321" stroke="#2f2f2c"/>
<circle cx="62" cy="513" r="6" fill="#d95926"/><text x="76" y="518" font-size="15" font-weight="650" fill="#f0efec">Claude Code</text>
<text x="56" y="542" font-size="13" fill="#8d8b84">headless, in a git worktree</text>
<rect x="352" y="487" width="250" height="70" rx="10" fill="#232321" stroke="#2f2f2c"/>
<circle cx="374" cy="513" r="6" fill="#199e70"/><text x="388" y="518" font-size="15" font-weight="650" fill="#f0efec">Codex</text>
<text x="368" y="542" font-size="13" fill="#8d8b84">headless, in a git worktree</text>
<line x1="294" y1="522" x2="348" y2="522" stroke="#6d6c66" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="321" y="512" text-anchor="middle" font-size="11.5" fill="#8d8b84">out?</text>
<text x="640" y="512" font-size="14" fill="#c3c2b7">Each step has a fallback chain: when one plan runs out,</text>
<text x="640" y="534" font-size="14" fill="#c3c2b7">the next agent picks it up. Review goes to the other vendor.</text>
<text x="640" y="556" font-size="13" fill="#8d8b84">Agents edit the worktree. They can’t push, merge, approve or overspend.</text>
</svg>